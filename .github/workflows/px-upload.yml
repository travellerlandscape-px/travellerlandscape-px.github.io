name: P-X Upload
on:
  push:
    branches: [main]
    paths: ["youtube/run.json"]
  workflow_dispatch:
    inputs:
      privacy:
        description: "Sichtbarkeit"
        type: choice
        options: [private, unlisted, public]
        default: private
      clip:
        description: "Bestimmter Clip (Teil des Dateinamens, leer = naechster)"
        required: false
        default: ""
      record:
        description: "Clip als erledigt markieren"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: px-upload
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q requests numpy
      - name: Auftrag lesen
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "PRIVACY=$(jq -r '.privacy // "private"' youtube/run.json)" >> $GITHUB_ENV
            echo "CLIP=$(jq -r '.clip // ""' youtube/run.json)" >> $GITHUB_ENV
            echo "RECORD=$(jq -r '.record // false' youtube/run.json)" >> $GITHUB_ENV
            echo "MODE=$(jq -r '.mode // ""' youtube/run.json)" >> $GITHUB_ENV
          else
            echo "PRIVACY=${{ inputs.privacy || 'private' }}" >> $GITHUB_ENV
            echo "CLIP=${{ inputs.clip }}" >> $GITHUB_ENV
            echo "RECORD=${{ inputs.record || 'false' }}" >> $GITHUB_ENV
          fi
      - name: Short erstellen und hochladen
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: 1Q95EUFwGKl0k0IIxLlwlsBs1hjYzSmNE
          STORIES_FILE: ${{ github.workspace }}/youtube/stories.json
          STATE_FILE: ${{ github.workspace }}/youtube/state.json
          RESULT_FILE: ${{ github.workspace }}/youtube/last-run.json
        shell: bash
        run: |
          mkdir -p work && cd work
          if [ "$MODE" = "sichtung" ] || [ "$MODE" = "montage" ] || [ "$MODE" = "stats" ] || [ "$MODE" = "musik" ] || [ "$MODE" = "passthrough" ] || [ "$MODE" = "update" ] || [ "$MODE" = "diagnose" ]; then
            PYTHONPATH=../youtube python3 ../youtube/px2.py 2>&1 | tee ../youtube/last-run.log
          else
            python3 ../youtube/px.py 2>&1 | tee ../youtube/last-run.log
          fi
          exit ${PIPESTATUS[0]}
      - name: Stand speichern
        if: always()
        run: |
          [ -f youtube/last-run.json ] || echo '{"ok": false}' > youtube/last-run.json
          grep -v '^::' youtube/last-run.log | tail -n 40 > youtube/last-run.txt 2>/dev/null || true; rm -f youtube/last-run.log
          git add youtube/last-run.json youtube/last-run.txt youtube/sichtung youtube/stats.json youtube/musik youtube/diagnose.json 2>/dev/null || true
          git config user.name "px-bot"
          git config user.email "px-bot@users.noreply.github.com"
          git add youtube/state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Upload-Stand" && git pull --rebase -q && git push)
